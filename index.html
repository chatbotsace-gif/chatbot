.header-title h1 {

.status {

.quickActions {

.quickActions button {

}

}

.messages {

  overflow-y: auto;
  padding: 15px;

  display: flex;
  flex-direction: column;
  gap: 15px;
}

.msg-wrapper {
  display: flex;
  gap: 10px;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.msg-wrapper.me {
  flex-direction: row-reverse;
}

.avatar {
  width: 35px;
  height: 35px;
  border-radius: 50%;

  justify-content: center;

.avatar.user {

}

.avatar.bot {
  background: linear-gradient(135deg, #06b6d4, #0891b2);
}

.msg {
  padding: 12px 16px;
  border-radius: 18px;

  font-size: 14px;
  line-height: 1.6;
  word-wrap: break-word;
  white-space: pre-line;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.msg-wrapper.me .msg {
  background: linear-gradient(135deg, #8b5cf6, #6366f1);

}

.msg-wrapper.bot .msg {
  background: #1e293b;
  color: #e2e8f0;
  border: 1px solid #3b82f6;
  border-bottom-left-radius: 4px;
}

.typing {
  display: flex;
  gap: 4px;
  padding: 12px;
}

.typing span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #3b82f6;
  animation: bounce 1.4s infinite;
}

.typing span:nth-child(2) {
  animation-delay: 0.2s;
}

.typing span:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes bounce {
  0%, 60%, 100% {

  }
  30% {
    transform: translateY(-10px);
  }

const adminLogs = document.getElementById('adminLogs');

  'admin': 'admin123',

function add(txt, user = false) {
  const w = document.createElement('div');
  w.className = `msg-wrapper ${user ? 'me' : 'bot'}`;
  
  const a = document.createElement('div');
  a.className = `avatar ${user ? 'user' : 'bot'}`;
  a.textContent = user ? '👤' : '🤖';
  
  const m = document.createElement('div');
  m.className = 'msg';
  m.textContent = txt;
  
  w.appendChild(a);
  w.appendChild(m);
  msg.appendChild(w);
  msg.scrollTop = msg.scrollHeight;
  
  if (user) {
    const log = {
      time: new Date().toLocaleString('pt-BR'),
      message: txt,
      userId: 'User-' + Math.random().toString(36).substr(2, 9),
      ip: 'IP-Hidden',
      timestamp: Date.now()
    };
    
    userLogs.push(log);
    saveToStorage(log);
    updateAdminPanel();
  }
}

async function saveToStorage(log) {
  try {
    if (window.storage) {
      const key = `msg-${log.timestamp}`;
      await window.storage.set(key, JSON.stringify(log), true);
    }
  } catch (e) {
    // Ignora erros de storage
  }
}

async function loadAllMessages() {
  try {
    if (window.storage) {
      const result = await window.storage.list('msg-', true);
      if (result && result.keys) {
        for (let key of result.keys) {
          try {
            const data = await window.storage.get(key, true);
            if (data && data.value) {
              const log = JSON.parse(data.value);
              if (!userLogs.find(l => l.timestamp === log.timestamp)) {
                userLogs.push(log);
              }
            }
          } catch (e) {
            // Ignora erros
          }
        }
        userLogs.sort((a, b) => b.timestamp - a.timestamp);
        updateAdminPanel();
      }
    }
  } catch (e) {
    // Ignora erros de carregamento
  }
}

  w.appendChild(t);
  msg.appendChild(w);
  msg.scrollTop = msg.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');

async function callGemini(txt) {
  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_KEY}`;
    
    const response = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        contents: [{
          parts: [{
            text: `Responda em português brasileiro de forma amigável, clara e resumida (máximo 200 palavras): ${txt}`
          }]
        }],
        generationConfig: {
          temperature: 0.7,
          maxOutputTokens: 500,
          topP: 0.8,
          topK: 40
        }
      })
    });

    const data = await response.json();
    
    if (data.candidates && data.candidates[0] && data.candidates[0].content) {
      return data.candidates[0].content.parts[0].text;
    }
    
    throw new Error('API falhou');
    
  } catch (error) {
    return getFallback(txt);
  }
}

function procLocal(t) {
  const l = t.toLowerCase().trim();
  
  if (/^(oi|olá|hello|hi|ola)/.test(l)) {
    return 'Oi! Como vai? 😊 Pergunte qualquer coisa!';
  }
  
  if (/(que horas|hora|time)/.test(l)) {
    return 'Agora são ' + new Date().toLocaleTimeString() + ' ⏰';
  }
  
  if (/(que dia|data|date)/.test(l)) {
    return 'Hoje é ' + new Date().toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + ' 📅';
  }
  
  if (/piada|joke/.test(l)) {
    const piadas = [
      'Por que o livro de matemática ficou triste?\nPorque tinha muitos problemas! 😄',
      'O que o pato disse para a pata?\nVem quá! 🦆',
      'Por que a galinha atravessou a rua?\nPara chegar do outro lado! 🐔',
      'O que é um pontinho amarelo no céu?\nUm Yellowcóptero! 🚁'
    ];
    return piadas[Math.floor(Math.random() * piadas.length)];
  }
  
  if (/(história|historia|story|conte)/.test(l)) {
    return 'Era uma vez um assistente virtual muito inteligente que adorava ajudar as pessoas! Ele respondia todas as perguntas com carinho e nunca se cansava de aprender coisas novas... 📖✨';
  }
  
  if (/(quem|criou|você|sobre|who)/.test(l)) {
    return 'Eu sou um assistente virtual criado com Google Gemini AI! Posso responder perguntas, fazer cálculos, contar piadas e muito mais! 🤖💡';
  }
  
  const calcMatch = l.match(/(\d+)\s*([+\-*/%])\s*(\d+)/);
  if (calcMatch) {
    try {
      const a = parseFloat(calcMatch[1]);
      const op = calcMatch[2];
      const b = parseFloat(calcMatch[3]);
      let r;
      
      if (op === '+') r = a + b;
      else if (op === '-') r = a - b;
      else if (op === '*') r = a * b;
      else if (op === '/' && b !== 0) r = a / b;
      else if (op === '/' && b === 0) return 'Erro: Não posso dividir por zero! 🚫';
      else if (op === '%') r = a % b;
      
      return `Resultado: ${r} 🧮`;
    } catch (e) {
      return 'Erro no cálculo! 😅';
    }
  }
  
  const pctMatch = l.match(/(\d+)%\s+(?:de|of)\s+(\d+)/);
  if (pctMatch) {
    const r = (parseInt(pctMatch[1]) * parseInt(pctMatch[2])) / 100;
    return `Resultado: ${r} 🧮`;
  }
  
  if (/(obrigad|thanks|valeu)/.test(l)) {
    return 'Por nada! Estou aqui para ajudar! 😊';
  }
  
  if (/(tchau|bye|adeus)/.test(l)) {
    return 'Até logo! Foi um prazer ajudar! 👋';
  }
  
  return null;
}

async function send() {
  const t = inp.value.trim();
  if (!t) return;
  
  btn.disabled = true;
  add(t, true);
  inp.value = '';
  
  const localResp = procLocal(t);
  
  if (localResp) {
    setTimeout(() => {
      add(localResp);
      btn.disabled = false;
      inp.focus();
    }, 500);
  } else {
    showTyping();
    
    const aiResp = await callGemini(t);
    
    hideTyping();
    add(aiResp);
    
    btn.disabled = false;
    inp.focus();
  }
}

function doLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errorMsg = document.getElementById('errorMsg');
  
  if (!user || !pass) {
    errorMsg.textContent = '❌ Preencha todos os campos!';
    errorMsg.style.display = 'block';
    return;
  }
  
  if (!usuarios[user]) {
    errorMsg.textContent = '❌ Usuário não encontrado!';
    errorMsg.style.display = 'block';
    return;
  }
  
  if (usuarios[user] !== pass) {
    errorMsg.textContent = '❌ Senha incorreta!';
    errorMsg.style.display = 'block';
    return;
  }
  
  loginSuccess(user, false);
}

function doRegister() {
  const user = document.getElementById('regUser').value.trim();
  const pass = document.getElementById('regPass').value;
  const pass2 = document.getElementById('regPass2').value;
  const errorMsg = document.getElementById('regErrorMsg');
  const successMsg = document.getElementById('successMsg');
  
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';
  
  if (!user || !pass || !pass2) {
    errorMsg.textContent = '❌ Preencha todos os campos!';
    errorMsg.style.display = 'block';
    return;
  }
  
  if (user.length < 3) {
    errorMsg.textContent = '❌ Usuário deve ter no mínimo 3 caracteres!';
    errorMsg.style.display = 'block';
    return;
  }
  
  if (pass.length < 4) {
    errorMsg.textContent = '❌ Senha deve ter no mínimo 4 caracteres!';
    errorMsg.style.display = 'block';
    return;
  }
  
  if (pass !== pass2) {
    errorMsg.textContent = '❌ As senhas não coincidem!';
    errorMsg.style.display = 'block';
    return;
  }
  
  if (usuarios[user]) {
    errorMsg.textContent = '❌ Usuário já existe!';
    errorMsg.style.display = 'block';
    return;
  }
  
  usuarios[user] = pass;
  successMsg.textContent = '✅ Cadastro realizado! Faça login agora.';
  successMsg.style.display = 'block';
  
  document.getElementById('regUser').value = '';
  document.getElementById('regPass').value = '';
  document.getElementById('regPass2').value = '';
  
  setTimeout(() => {
    toggleForm();
  }, 2000);
}

}
